name: Setup Playwright Chromium
description: Cache and install Playwright Chromium for home package CI

runs:
  using: composite
  steps:
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(pnpm --filter home exec playwright --version | awk '{print $2}')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-${{ runner.os }}-chromium-

    - name: Install Playwright Chromium (browsers + OS deps)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter home exec playwright install --with-deps chromium

    - name: Install Playwright OS deps only
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter home exec playwright install-deps chromium
