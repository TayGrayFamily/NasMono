name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm -w format:check

      - name: Lint workspace
        run: pnpm -w -r lint || echo "Some packages may not have lint scripts"

  build-and-verify:
    name: Build and Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -w -r build

      - name: Verify Release Artifacts (packages/home)
        run: |
          echo "Verifying build output for packages/home..."
          if [ ! -d "packages/home/dist" ]; then
            echo "::error::packages/home/dist is missing! Client build failed."
            exit 1
          fi
          if [ ! -d "packages/home/dist-server" ]; then
            echo "::error::packages/home/dist-server is missing! Server build failed."
            exit 1
          fi

  docker-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [game-server, game-hub]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.package }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.package }}:latest
