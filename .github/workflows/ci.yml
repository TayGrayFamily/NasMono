name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm -w format:check

      - name: Lint workspace
        run: pnpm -r run lint

  build-and-verify:
    name: Build and Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -w -r build

      - name: Run tests
        run: pnpm -r test

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium

      - name: Home integration smoke (API + UI + prod server)
        run: node scripts/smoke-home.mjs --skip-build
        env:
          SMOKE_PORT: 19888
          CI: true

      - name: Validate docker-compose.unraid.yml
        run: |
          UNRAID_API_KEY=ci-dummy POSTGRES_PASSWORD=ci-dummy \
            docker compose -f docker-compose.unraid.yml config --quiet

      - name: Verify Release Artifacts (packages/home)
        run: |
          echo "Verifying build output for packages/home..."
          if [ ! -d "packages/home/dist" ]; then
            echo "::error::packages/home/dist is missing! Client build failed."
            exit 1
          fi
          if [ ! -d "packages/home/dist-server" ]; then
            echo "::error::packages/home/dist-server is missing! Server build failed."
            exit 1
          fi
          echo "Build artifacts verified successfully."

  docker-smoke:
    name: Docker build smoke (home)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build home Docker image
        run: docker build -f packages/home/Dockerfile -t nasmono-home-ci .

      - name: Run container health smoke
        run: |
          docker run -d --name nasmono-home-smoke \
            -p 19889:8888 \
            -v "$PWD/packages/home/test/fixtures:/app/test-fixtures:ro" \
            -e PORT=8888 \
            -e DOCKER_FIXTURE_PATH=/app/test-fixtures/containers.json \
            -e UNRAID_API_KEY= \
            -e UNRAID_GRAPHQL_URL= \
            -e DOCKER_SOCKET_PATH=null \
            nasmono-home-ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19889/api/health; then
              echo ""
              curl -sf http://127.0.0.1:19889/api/launchpad | head -c 200
              echo ""
              exit 0
            fi
            sleep 1
          done
          docker logs nasmono-home-smoke
          exit 1
