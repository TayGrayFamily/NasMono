name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm -w format:check

      - name: Lint workspace
        run: pnpm -r run lint

  build-and-verify:
    name: Build and Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -w -r build

      - name: Run tests
        run: pnpm -r test

      - name: Verify Release Artifacts (packages/home)
        run: |
          echo "Verifying build output for packages/home..."
          if [ ! -d "packages/home/dist" ]; then
            echo "::error::packages/home/dist is missing! Client build failed."
            exit 1
          fi
          if [ ! -d "packages/home/dist-server" ]; then
            echo "::error::packages/home/dist-server is missing! Server build failed."
            exit 1
          fi
          echo "Build artifacts verified successfully."
