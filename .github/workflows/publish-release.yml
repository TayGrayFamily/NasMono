name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        default: v0.0.70

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          NEW_TAG: ${{ inputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          for pkg in home game-server game-hub; do
            IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}-${pkg}:${NEW_TAG}"
            LATEST_IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}-${pkg}:latest"

            echo "Building image: $IMAGE"
            docker build -f packages/$pkg/Dockerfile -t "$IMAGE" -t "$LATEST_IMAGE" .
            docker push "$IMAGE"
            docker push "$LATEST_IMAGE"
          done

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes "Docker images pushed to ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-*"
          fi
