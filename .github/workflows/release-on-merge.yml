name: Release on Push or Merge

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  bump-and-release:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine semver bump
        id: semver
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const event = context.eventName;
            if (event === 'pull_request') {
              const labels = context.payload.pull_request.labels.map(l => l.name.toLowerCase());
              if (labels.includes('major')) return 'major';
              if (labels.includes('minor')) return 'minor';
            }
            return 'patch';

      - name: Bump version
        run: |
          pnpm version ${{ steps.semver.outputs.result }} -m "chore(release): %s [skip ci]"

      - name: Push changes
        run: git push origin HEAD --tags

      - name: Checkout the released tag
        run: |
          NEW_TAG=$(git describe --tags --abbrev=0)
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git fetch --tags
          git checkout "$NEW_TAG"

      - name: Install dependencies (for build)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          NEW_TAG: ${{ env.NEW_TAG }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          # Convert to lowercase
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          # Correct path: ghcr.io/owner/repo-package:tag
          # We'll use the REPO_LC as the base for the package names
          for pkg in home game-server game-hub; do
            IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}-${pkg}:${NEW_TAG}"
            LATEST_IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}-${pkg}:latest"
            
            echo "Building image: $IMAGE"
            docker build -f packages/$pkg/Dockerfile -t "$IMAGE" -t "$LATEST_IMAGE" .
            docker push "$IMAGE"
            docker push "$LATEST_IMAGE"
          done

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG=${{ env.NEW_TAG }}
          gh release create "$NEW_TAG" --title "$NEW_TAG" --notes "Docker images pushed to ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-*"
