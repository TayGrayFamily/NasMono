version: '3.8'

services:
  nasmono-home:
    # Image can be overridden via IMAGE env var; default uses GHCR with lowercase owner/repo
    image: '${IMAGE:-ghcr.io/taygrayfamily/nasmono-home:${IMAGE_TAG:-latest}}'
    container_name: nasmono-home
    env_file:
      - .env
    ports:
      - '${HOST_PORT:-8888}:80'
    volumes:
      # Read-only Docker socket (omit this block if you use UNRAID_GRAPHQL_URL + UNRAID_API_KEY instead)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    # All runtime configuration (including secrets) should be provided via the adjacent .env file
    # The .env file is loaded by `env_file:` above and its values will be available inside the container.
    # Do NOT commit `.env` to source control. Use Unraid secrets/registry auth for private values.
    labels:
      - 'com.tailscale.description=NasMono Home app'

# Notes:
# - Put a .env next to this file: IMAGE_TAG=latest HOST_PORT=8888, optional PORT=80 (default 80 in container).
# - Container list: mount docker.sock (above) OR set UNRAID_GRAPHQL_URL and UNRAID_API_KEY (omit the socket volume).
# - UNRAID_GRAPHQL_URL must be reachable from this container (e.g. http://192.168.x.x/graphql).
# - For local dev, optional UNRAID_* / DOCKER_SOCKET_PATH live in repo-root .env (Vite envDir).
# - Do NOT commit secrets. Use Unraid UI secrets or registry auth for private images.
