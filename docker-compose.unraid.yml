x-logging: &json-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  nasmono-home:
    image: ghcr.io/taygrayfamily/nasmono-home:latest
    container_name: web_app
    restart: unless-stopped
    ports:
      - '${HOME_BACKEND_PORT:-8888}:8888'
    environment:
      PORT: '8888'
      LAUNCHPAD_CONFIG_PATH: /config/apps.json
      REACHABILITY_GATEWAY: http://host.docker.internal
      UNRAID_GRAPHQL_URL: http://tower:8080/graphql
      UNRAID_API_KEY: ${UNRAID_API_KEY}
      ADMIN_ACTIONS_ENABLED: 'true'
      STACK_UPDATE_CONTAINER_MATCH: '^web_app$|^game_server$|^game_hub_ui$|^game_hub_db$'
      COMPOSE_MANAGER_STACK_URL: 'http://tower/Docker/Compose'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /mnt/user/appdata/nasmono-home:/config
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8888/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *json-logging
    labels:
      - 'com.tailscale.description=NasMono Home app'

  game-server:
    image: ghcr.io/taygrayfamily/nasmono-game-server:latest
    container_name: game_server
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-game_hub}
      NODE_ENV: production
    networks:
      - game-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *json-logging

  game-hub:
    image: ghcr.io/taygrayfamily/nasmono-game-hub:latest
    container_name: game_hub_ui
    restart: unless-stopped
    ports:
      - '8000:80'
    networks:
      - game-network
    depends_on:
      game-server:
        condition: service_healthy
    environment:
      # Runtime-injected into /env-config.js by the container entrypoint (Charades Giphy images).
      VITE_GIPHY_API_KEY: ${VITE_GIPHY_API_KEY:-}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *json-logging

  db:
    image: postgres:16-alpine
    container_name: game_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-game_hub}
      # Subdirectory keeps the mount root clean (avoids initdb "not empty" on junk files).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/user/appdata/postgres-game-hub:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - game-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-game_hub}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *json-logging

  # public-tunnel removed 2026-06-30 (ADR-0007): LAN-only for friends/family.
  # To re-enable external access, add cloudflared with Cloudflare Access — do not expose raw.

networks:
  game-network:
    external: true
