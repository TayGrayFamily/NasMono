server {
    listen 80;

    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # Docker embedded DNS — resolve upstream at request time so nginx starts even
    # when game-server is not running yet (static proxy_pass resolves at boot).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $game_server_upstream game-server:3001;

    # Forward API requests to the backend container
    location /api/ {
        proxy_pass http://$game_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward socket.io requests to the backend
    location /socket.io/ {
        proxy_pass http://$game_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
